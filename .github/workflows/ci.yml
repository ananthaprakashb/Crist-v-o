name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Unit tests
        run: npm test

      - name: Render Workflows typecheck
        run: npm run workflows:check

      - name: Evidence API typecheck
        run: npm run server:check

      - name: Production build
        run: npm run build

      - name: Web API smoke test
        run: |
          npm run server:start > /tmp/cristovao-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for attempt in {1..10}; do
            if curl --fail --silent http://127.0.0.1:3001/healthz > /tmp/health.json; then
              break
            fi
            sleep 1
          done
          cat /tmp/health.json
          curl --fail --silent http://127.0.0.1:3001/source-intelligence.json > /tmp/feed.json
          node -e "const f=require('/tmp/feed.json'); if(!Array.isArray(f.sources)) process.exit(1); console.log('fallback sources:', f.sources.length)"

          curl --fail --silent -X POST http://127.0.0.1:3001/api/intake/structure \
            -H 'content-type: application/json' \
            --data '{"input":"I am on H-1B. My latest approval is valid through September 30, 2026."}' > /tmp/intake.json
          node -e "const f=require('/tmp/intake.json'); if(f.petitionValidTo!=='2026-09-30') { console.error(f); process.exit(1) } console.log('intake method:', f.method)"

          curl --fail --silent -X POST http://127.0.0.1:3001/api/document/extract \
            -H 'content-type: application/json' \
            --data '{"synthetic":true,"syntheticText":"Receipt Number: IOE0912345678\nClassification: H-1B\nValid To: September 30, 2027"}' > /tmp/document.json
          node -e "const f=require('/tmp/document.json'); if(f.fields?.validTo?.value!=='2027-09-30') { console.error(f); process.exit(1) } console.log('document method:', f.method)"
